name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 14 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing required GitHub Secrets."
            exit 1
          fi

          echo "Checking Supabase database activity..."

          HTTP_CODE=$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /tmp/response.txt \
            -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/access_requests?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Supabase query failed."
            exit 1
          fi

          echo "Supabase database activity confirmed."
