name: Supabase Keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "$SUPABASE_URL" > /dev/null
          echo "Supabase ping successful"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
